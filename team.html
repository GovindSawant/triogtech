<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Team - TriOG Tech</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <a href="index.html">
                <svg width="60" height="60" viewBox="0 0 140 140">
                    <image href="assets/logo.png" width="140" height="140" />
                </svg>
            </a>
        </div>
        <nav class="nav">
            <div class="close-btn" onclick="toggleMenu()">×</div>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="team.html" class="active">Team</a>
            <a href="contact.html">Contact</a>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
                <span class="theme-icon">☀️</span>
            </button>
        </nav>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </header>

    <!-- Team Section -->
    <section class="section team">
        <h2>Our Team</h2>
        <div class="team-container">
            <div class="team-card">
                <div class="team-image">
                    <img src="assets/ganesh.jpeg" alt="Ganesh Thakur" />
                </div>
                <div class="team-info">
                    <h3>Ganesh Thakur</h3>
                    <p>Developer</p>
                </div>
                <div class="team-links">
                    <a href="#" class="linkedin" aria-label="LinkedIn"><img src="assets/linkedin-fill.png"
                            alt="LinkedIn" /></a>
                    <a href="#" class="github" aria-label="GitHub"><img src="assets/github-fill.png" alt="GitHub" /></a>
                </div>
            </div>

            <div class="team-card">
                <div class="team-image">
                    <img src="assets/govind.jpg" alt="Govind Sawant" />
                </div>
                <div class="team-info">
                    <h3>Govind Sawant</h3>
                    <p>Developer</p>
                </div>
                <div class="team-links">
                    <a href="#" class="linkedin" aria-label="LinkedIn"><img src="assets/linkedin-fill.png"
                            alt="LinkedIn" /></a>
                    <a href="#" class="github" aria-label="GitHub"><img src="assets/github-fill.png" alt="GitHub" /></a>
                </div>
            </div>

            <div class="team-card">
                <div class="team-image">
                    <img src="assets/omkar.jpeg" id="omkar-img" alt="Omkar Parab" style="object-position: top;" />
                </div>
                <div class="team-info">
                    <h3>Omkar Parab</h3>
                    <p>Developer</p>
                </div>
                <div class="team-links">
                    <a href="#" class="linkedin" aria-label="LinkedIn"><img src="assets/linkedin-fill.png"
                            alt="LinkedIn" /></a>
                    <a href="#" class="github" aria-label="GitHub"><img src="assets/github-fill.png" alt="GitHub" /></a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 TriOG Tech. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
